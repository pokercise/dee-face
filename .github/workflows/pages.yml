name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - name: See how Pages is published
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pages",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "dee-face-pages",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
              mode = data.get("build_type") or "unknown"
          except Exception as exc:
              code = getattr(exc, "code", None)
              mode = "disabled" if code == 404 else "unknown"
              print(f"pages api: {code or exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"mode={mode}\n")
          print("mode", mode)
          if mode in ("legacy", "disabled"):
              print("Serve the repository root from main: Source = Deploy from a branch, Branch = main, Folder = / (root).")
              print("This workflow uploads that same root only when Source is GitHub Actions.")
          PY

  deploy:
    needs: detect
    if: needs.detect.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site root
        run: |
          mkdir -p _site
          rsync -a --exclude .git --exclude .github --exclude _site ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
